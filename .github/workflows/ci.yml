name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: sdk
    uses: Quantova/Quantova-Ci/.github/workflows/npm-wasm-sdk.yml@a751dcb87993915dd65b2e72f57361ff17e0685b
    permissions:
      contents: read
      id-token: write
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    with:
      test-command: |
        set -euo pipefail
        npm test

  macos:
    name: macos
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: install
        run: npm ci --ignore-scripts
      - name: test
        run: npm test

  release-checks:
    name: release checks
    needs: sdk
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: the published version must carry provenance for this repository, tag and commit
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          V=$(node -p "require('./package.json').version")
          url=""
          for _ in $(seq 1 40); do
            url=$(npm view "$PKG@$V" dist.attestations.url --prefer-online 2>/dev/null || true)
            [ -n "$url" ] && break
            sleep 15
          done
          [ -n "$url" ] || { echo "$PKG@$V shows no provenance attestation" >&2; exit 1; }
          integrity=$(npm view "$PKG@$V" dist.integrity)
          curl -sSf "$url" -o "$RUNNER_TEMP/attestations.json"
          node - "$RUNNER_TEMP/attestations.json" "$integrity" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" <<'JS'
          'use strict';
          const fs = require('fs');
          const [file, integrity, repo, sha, ref] = process.argv.slice(2);
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          const slsa = (doc.attestations || []).filter((a) => a.predicateType === 'https://slsa.dev/provenance/v1');
          if (slsa.length !== 1) throw new Error('expected one SLSA provenance attestation, found ' + slsa.length);
          const st = JSON.parse(Buffer.from(slsa[0].bundle.dsseEnvelope.payload, 'base64').toString('utf8'));
          const want = Buffer.from(integrity.replace(/^sha512-/, ''), 'base64').toString('hex');
          if (!st.subject || st.subject.length !== 1 || st.subject[0].digest.sha512 !== want) throw new Error('the attested subject is not the published tarball');
          const bd = st.predicate.buildDefinition;
          const wf = bd.externalParameters.workflow;
          if (wf.repository !== 'https://github.com/' + repo) throw new Error('built from ' + wf.repository + ', not ' + repo);
          if (wf.ref !== ref) throw new Error('built from ref ' + wf.ref + ', not ' + ref);
          const src = (bd.resolvedDependencies || []).find((d) => d.digest && d.digest.gitCommit);
          if (!src || src.digest.gitCommit !== sha) throw new Error('built from commit ' + (src && src.digest.gitCommit) + ', not ' + sha);
          console.log('provenance binds ' + st.subject[0].name + ' to ' + repo + ' ' + ref + ' at ' + sha);
          JS
      - name: the SBOM of the release
        run: npm sbom --package-lock-only --omit dev --sbom-format cyclonedx > "$RUNNER_TEMP/sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-sbom
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/sbom.cdx.json
